name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['update.json', 'update-android9.json', 'ZazaReader-*.apk', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK and manifests
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,os
          m=json.loads(pathlib.Path('update.json').read_text())
          tag='v'+m['versionName']
          apk='ZazaReader-'+m['versionName']+'.apk'
          data=pathlib.Path(apk).read_bytes()
          for manifest, minimum_sdk in [('update.json', 33), ('update-android9.json', 28)]:
              current=json.loads(pathlib.Path(manifest).read_text())
              assert current['schema']==1 and current['packageName']=='me.zaza.reader'
              assert current['versionCode']==m['versionCode'] and current['versionName']==m['versionName']
              assert current['minSdk']==minimum_sdk
              assert current['size']==len(data) and current['sha256']==hashlib.sha256(data).hexdigest()
              assert current['apkUrl']==f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/{apk}'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'RELEASE_TAG={tag}\nAPK_FILE={apk}\n')
          PYCODE
      - name: Create draft, upload assets, publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Zaza Reader $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" "$APK_FILE" update.json update-android9.json --clobber
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-check" --pattern "$APK_FILE" --pattern update.json --pattern update-android9.json
          cmp "$APK_FILE" "$RUNNER_TEMP/release-check/$APK_FILE"
          cmp update.json "$RUNNER_TEMP/release-check/update.json"
          cmp update-android9.json "$RUNNER_TEMP/release-check/update-android9.json"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Verify public update URLs without authentication
        run: |
          set -euo pipefail
          for manifest in update.json update-android9.json; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$manifest" -o "$RUNNER_TEMP/$manifest"
            cmp "$manifest" "$RUNNER_TEMP/$manifest"
          done
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_FILE" -o "$RUNNER_TEMP/public.apk"
          cmp "$APK_FILE" "$RUNNER_TEMP/public.apk"
