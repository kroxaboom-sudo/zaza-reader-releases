name: Update source recovery registry

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download collective registry
        run: |
          mkdir -p source-recovery
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            https://zaza-reader-discovery.poluyanovis.workers.dev/v1/sources \
            -o source-recovery/registry.json.new
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-recovery/registry.json.new')
          data=json.loads(p.read_text())
          assert data.get('ok') is True
          assert isinstance(data.get('sources'), list)
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':'))+'\n')
          PY
          mv source-recovery/registry.json.new source-recovery/registry.json
      - name: Commit updated registry
        run: |
          git config user.name 'zaza-reader-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-recovery/registry.json
          if git diff --cached --quiet; then
            echo 'Registry unchanged'
          else
            git commit -m 'Update source recovery registry'
            git push
          fi
