name: Audit release page hashes once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hash-release-page-once.yml']
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print reviewed file hashes
        run: sha256sum README.md RELEASE_NOTES.md
