name: Audit live Runtime Pack r7 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-runtime-r7-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and diagnose live Runtime Packs
        shell: bash
        run: |
          set -u
          declare -A urls=(
            [hostkey]='https://grouple-core.duckdns.org/api/runtime-pack'
            [cloudflare]='https://zaza-reader-discovery.poluyanovis.workers.dev/api/runtime-pack'
            [vercel]='https://grouple-core.vercel.app/api/runtime-pack'
          )
          failed=0
          for name in hostkey cloudflare vercel; do
            echo "=== $name ==="
            code="$(curl --silent --show-error --location --max-time 25 --output "/tmp/$name.json" --write-out '%{http_code}' "${urls[$name]}" || echo 000)"
            echo "HTTP $code"
            if [ -s "/tmp/$name.json" ]; then
              echo "BODY $(cat "/tmp/$name.json")"
            else
              echo 'BODY <empty>'
            fi
            if [ "$code" != 200 ]; then
              failed=1
              continue
            fi
            NAME="$name" FILE="/tmp/$name.json" node <<'NODE' || failed=1
          const fs=require('fs'),crypto=require('crypto');
          const name=process.env.NAME,file=process.env.FILE;
          const envelope=JSON.parse(fs.readFileSync(file,'utf8'));
          if(envelope.format!=='grouple-runtime-envelope'||envelope.schema!==1||envelope.keyId!=='runtime-v1'||envelope.algorithm!=='Ed25519') throw new Error(name+': invalid envelope');
          const payload=Buffer.from(envelope.payload,'base64');
          const signature=Buffer.from(envelope.signature,'base64');
          const key=crypto.createPublicKey({key:Buffer.from('MCowBQYDK2VwAyEA3NZzgsW+D+9IYnJ8zUJlIIvBEw4BbJlw4nIngmV1PkU=','base64'),format:'der',type:'spki'});
          if(signature.length!==64||!crypto.verify(null,payload,key,signature)) throw new Error(name+': signature verification failed');
          const pack=JSON.parse(payload.toString('utf8'));
          if(pack.revision<7) throw new Error(name+': stale revision '+pack.revision);
          if(pack.endpoints?.primaryApi!=='https://grouple-core.duckdns.org') throw new Error(name+': wrong primary '+pack.endpoints?.primaryApi);
          const extraction=pack.sources?.zazaza?.chapterExtraction;
          if(!extraction||extraction.image?.class!=='manga-img'||extraction.pageCounter?.class!=='page-selector') throw new Error(name+': chapterExtraction missing');
          if(!Array.isArray(pack.endpoints?.fallbackApis)||!pack.endpoints.fallbackApis.includes('https://zaza-reader-discovery.poluyanovis.workers.dev')) throw new Error(name+': Cloudflare fallback missing');
          console.log('VERIFIED '+JSON.stringify({name,revision:pack.revision,fallbacks:pack.endpoints.fallbackApis,signature:'valid'}));
          NODE
          done
          echo '=== health/discovery ==='
          for base in 'https://grouple-core.duckdns.org' 'https://zaza-reader-discovery.poluyanovis.workers.dev' 'https://grouple-core.vercel.app'; do
            echo "BASE $base"
            curl --silent --show-error --location --max-time 15 --write-out '\nHEALTH_HTTP %{http_code}\n' "$base/healthz" || true
            curl --silent --show-error --location --max-time 15 --write-out '\nDISCOVERY_HTTP %{http_code}\n' "$base/api/discovery" || true
          done
          exit "$failed"
